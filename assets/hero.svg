<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mahesh Koeri — Learning in public</title>
  <desc id="desc">A dark, minimal developer banner with electric blue and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b13"/>
      <stop offset="0.56" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111025"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57c7ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="84%" cy="15%" r="72%">
      <stop offset="0" stop-color="#6941c6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6941c6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#91a4c7" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M48 286H1152" stroke="url(#accent)" stroke-opacity=".6"/>
  <path d="M48 286H276" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="1100" cy="74" r="3" fill="#57c7ff"/>
  <circle cx="1120" cy="74" r="3" fill="#a78bfa"/>
  <circle cx="1140" cy="74" r="3" fill="#57c7ff" fill-opacity=".5"/>
  <text x="72" y="104" fill="#91a4c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="4">DEVELOPER PROFILE · 01</text>
  <text x="68" y="190" fill="#f4f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">MAHESH KOERI</text>
  <text x="72" y="232" fill="#c4cee0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Learning in public. Building with intention.</text>
  <text x="72" y="322" fill="#91a4c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2">PYTHON  ·  JAVASCRIPT  ·  HTML WEB DEVELOPMENT BASICS</text>
</svg>
